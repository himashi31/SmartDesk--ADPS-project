
# SmartDesk Backend Configuration

spring.application.name=smartdesk-backend
server.port=${PORT:8080}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartdesk?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Security ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---------- Demo Data ----------
app.seed-demo-data=${SEED_DEMO_DATA:false}
