# Production profile (Day 11). Activate with SPRING_PROFILES_ACTIVE=prod
# All secrets MUST come from environment variables – no defaults here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS}
app.seed-demo-data=${SEED_DEMO_DATA:false}
server.error.include-stacktrace=never
logging.level.root=INFO
